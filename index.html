<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Scientist Portfolio</title>
  <!--
  IMAGE SETUP:
  1. Create a folder called /images/ in your project root
  2. Add profile photo as: images/profile.jpg
  3. Add project screenshots as: images/project1.jpg, images/project2.jpg ...
  4. Update the src attributes below from placeholder URLs to ./images/filename.jpg
-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <img src="" alt="Profile Photo" class="profile-photo">
      <!-- TODO: Replace this src with your real image path e.g. ./images/profile.jpg -->

      <h1 class="profile-name"></h1>
      <p class="profile-title"></p>
      <p class="profile-location"></p>

      <div class="social-row">
        <a href="" class="social-icon linkedin" target="_blank" title="LinkedIn">
          <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="" class="social-icon github" target="_blank" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="" class="social-icon kaggle" target="_blank" title="Kaggle">
          <span class="kaggle-text">K</span>
        </a>
        <a href="" class="social-icon medium" target="_blank" title="Medium">
          <i class="fa-brands fa-medium"></i>
        </a>
        <a href="" class="email-btn">email me</a>
      </div>

      <div class="sidebar-section about-section">
        <h3 class="section-label">About</h3>
        <p class="about-bio"></p>
      </div>

      <div class="sidebar-section skills-section">
        <h3 class="section-label">Skills</h3>
        <div class="skills-list"></div>
      </div>
    </aside>

    <!-- Right Content -->
    <main class="main-content">
      <section class="content-section projects-section">
        <h2 class="section-label">Projects</h2>
        <div class="projects-grid"></div>
      </section>

      <hr class="section-divider">

      <section class="content-section experience-section">
        <h2 class="section-label">Experience</h2>
        <div class="experience-list"></div>
      </section>

      <hr class="section-divider">

      <section class="content-section education-section">
        <h2 class="section-label">Education</h2>
        <div class="education-list"></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
